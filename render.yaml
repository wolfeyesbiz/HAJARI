services:
  - type: web
    name: hajari-app
    runtime: node
    plan: free
    buildCommand: npm --prefix server install --include=dev && npm --prefix web install --include=dev && npm --prefix web run build && npm --prefix server run build
   startCommand: npm --prefix server start   
    healthCheckPath: /api/health
    region: singapore
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DRIVER
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: SMS_DRIVER
        value: log   